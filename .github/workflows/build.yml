name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # Pinned: windows-latest is now windows-2025 (build 26100), where the
          # serialport node-gyp rebuild fails with "Could not find any Visual
          # Studio installation to use". windows-2022 has the working toolchain.
          - os: windows-2022
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: interplay-app
        run: npm install

      - name: Build app
        working-directory: interplay-app
        run: npm run build:${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interplay-${{ matrix.platform }}
          path: |
            interplay-app/release/*.zip
            interplay-app/release/*.dmg
            interplay-app/release/*.exe

  release:
    needs: build
    # Publish whatever built successfully, even if one platform's build failed
    # (e.g. Windows native-module compile). Without this, a single failed leg
    # would cancel the matrix and skip the release entirely.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
